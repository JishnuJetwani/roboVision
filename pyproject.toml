[project]
name = "robovision"
version = "1.0.0"
description = "Vision-guided cup grasping with PPO and behavior cloning"
requires-python = ">=3.11,<3.13"
dependencies = [
  "mujoco==3.3.7",
  "gymnasium==1.2.1",
  "stable-baselines3==2.7.0",
  "torch==2.8.0",
  "numpy==2.2.6",
  "matplotlib==3.10.7",
  "imageio==2.37.0",
  "imageio-ffmpeg==0.6.0",
  "pillow==11.3.0",
]

[dependency-groups]
dev = ["pytest==8.4.2"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
